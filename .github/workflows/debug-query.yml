name: Debug - Consulta temporal de matricula (solo lectura)

on:
  workflow_dispatch:

jobs:
  query:
    name: Consultar tabla matricula
    runs-on: self-hosted
    steps:
      - name: SELECT de diagnostico (solo lectura)
        run: |
          PROJECT_DIR="/home/server/Statistical-Academic-Analysis"
          cd "$PROJECT_DIR"
          docker compose exec -T postgres psql -U academia -d academia -c "
            SELECT subsistema_id, ciclo_escolar, cuatrimestre, programa_educativo,
                   total, bajas_reprobacion, bajas_desercion, nuevo_ingreso,
                   otros_ingresos, hombres, mujeres
            FROM matricula
            WHERE programa_educativo ILIKE '%CADENA DE SUMINISTRO%'
            ORDER BY subsistema_id, ciclo_escolar, cuatrimestre;
          "
